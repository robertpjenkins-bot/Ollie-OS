name: Record the Ollie OS start-up video

# One time: when the newest build (the commit in .github/record-boot.txt) is
# on the "Ollie OS (newest)" release, films it starting up in a virtual PC
# (UEFI, KVM): from the USB drive, and installed on a disk
# (.github/record-boot.sh). The film goes to the branch "ollie-os-video".
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/record-boot.txt"]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf ffmpeg socat xorriso imagemagick tesseract-ocr fonts-dejavu-core
          sudo chmod 666 /dev/kvm || true

      - name: Wait for the build, then get its ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          want="$(sed -n 's/^build=//p' .github/record-boot.txt)"
          t=""
          for _ in $(seq 180); do
            t="$(gh release view ollie-os-newest --json targetCommitish -q .targetCommitish 2>/dev/null || true)"
            [ "$t" = "$want" ] && break
            sleep 30
          done
          [ "$t" = "$want" ] || { echo "the build $want did not reach the release"; exit 1; }
          mkdir -p iso
          gh release download ollie-os-newest -D iso -p 'ollie-os-*.iso' -p 'ollie-os-*.iso.part*'
          cd iso
          if ls ./*.iso.part0 >/dev/null 2>&1; then
            p="$(ls ./*.iso.part0)"
            cat "${p%.part0}".part* >"${p%.part0}" && rm -f ./*.iso.part*
          fi
          ls -la

      - name: Film it
        run: OLLIE_VERSION="$(cat os/profile/airootfs/etc/ollie-version)" bash .github/record-boot.sh "$(ls iso/*.iso | head -n 1)" film

      - name: Put the film on the branch ollie-os-video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/video"
          mkdir -p "$d"
          cp film/ollie-os-start-up.mp4 "$d/"
          cd "$d"
          printf 'Ollie OS starting up, filmed in a virtual PC (%s, build %s).\n' "$(date -u +%Y-%m-%d)" "$(sed -n 's/^build=//p' "$GITHUB_WORKSPACE/.github/record-boot.txt" | cut -c1-7)" >README.md
          git init -q -b ollie-os-video
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Ollie OS start-up video"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ollie-os-video

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ollie-os-start-up
          path: |
            film/*.mp4
            film/install.log
          retention-days: 7
