name: Put the Mac installer on 1.9 and 1.8

# One time: replaces the Mac installer (.dmg and .zip) on the releases called
# Ollie OS 1.9 and 1.8 with downloads/ (its Read me now has the website link).
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/upload-mac-installer.txt"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in ollieosv1.9 ollie-update-20261120-1800; do
            gh release upload "$tag" downloads/Ollie-OS-Installer-Mac.dmg downloads/Ollie-OS-Installer-Mac.zip --clobber
          done
