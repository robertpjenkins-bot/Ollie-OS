name: Upload the Mac installer to the 1.8 release

# One time: replaces the Mac installer on the release called 1.8 with the new
# one (it works on Macs with an Apple chip), as .dmg and .zip. Runs when
# .github/upload-mac-installer.txt is pushed. Nothing else on the release changes.
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/upload-mac-installer.txt"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s downloads/Ollie-OS-Installer-Mac.dmg
          test -s downloads/Ollie-OS-Installer-Mac.zip
          gh release upload ollie-update-20261120-1800 downloads/Ollie-OS-Installer-Mac.dmg downloads/Ollie-OS-Installer-Mac.zip --clobber
          gh release view ollie-update-20261120-1800 --json assets --jq '.assets[] | "\(.name)  \(.size)"'
