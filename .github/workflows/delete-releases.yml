name: Delete releases

# Deletes the releases (and their tags) named in .github/delete-releases.txt,
# one tag per line. Runs when that file is pushed.
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/delete-releases.txt"]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag; do
            [[ -n $tag && $tag != \#* ]] || continue
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes && echo "deleted $tag"
            else
              echo "(no release $tag)"
            fi
          done < .github/delete-releases.txt
