name: Make the Ollie OS 2.0 release

# One time: makes the release "Ollie OS 2.0" (tag ollieosv2.0, at the commit of
# the tested build on "Ollie OS (newest)") with only the Windows, Mac and Linux
# installers and the Linux updater. Runs when .github/release-2-0.txt is pushed.
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/release-2-0.txt"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^build=//p' .github/release-2-0.txt)"
          have="$(gh release view ollie-os-newest --json targetCommitish -q .targetCommitish)"
          [ "$have" = "$want" ] || { echo "Ollie OS (newest) is build $have, not $want"; exit 1; }
          mkdir -p rel
          gh release download ollie-os-newest -D rel \
            -p 'Ollie-OS-Installer-x86_64.AppImage' -p 'Ollie-OS-Installer-Windows.exe' -p 'Ollie-OS-Installer-Mac.dmg'
          cp downloads/Ollie-OS-Latest-Updater-x86_64.AppImage rel/
          ls -la rel
          [ "$(ls rel | wc -l)" = 4 ]
          for f in rel/*; do test -s "$f"; done
          gh release create ollieosv2.0 --target "$want" --title "Ollie OS 2.0" --latest \
            --notes-file .github/release-2-0-notes.md rel/*
          gh release view ollieosv2.0 --json name,tagName,assets -q '.name + " (" + .tagName + "): " + ([.assets[].name] | join(", "))'
