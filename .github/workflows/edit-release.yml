name: Edit a release text

# One time: the release called v1.3 (tag ollieos.6) says 1.6 and talks about
# installing Windows, which Ollie OS no longer does. Runs when
# .github/edit-release.txt is pushed. Only the text changes: not the name, not the files.
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/edit-release.txt"]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ollieos.6
          gh release view "$tag" --json body -q .body >body.md
          python3 - <<'PY'
          import re
          s = open("body.md", newline="").read()
          s = s.replace("## Ollie OS 1.6", "## Ollie OS 1.3", 1)
          s = re.sub(r"- \*\*Install Windows too\.\*\*[^\n]*\n", "", s)
          s = re.sub(r"\n*### Good to know about Windows.*\Z", "\n", s, flags=re.S)
          open("body.new.md", "w", newline="").write(s)
          PY
          diff body.md body.new.md || true
          gh release edit "$tag" --notes-file body.new.md
