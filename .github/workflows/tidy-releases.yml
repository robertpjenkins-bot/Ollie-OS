name: Tidy releases

# One time: gives the version releases the same name (Ollie OS v1.0 ... v1.7)
# and adds the missing v1.4 (its Updater). Runs when .github/tidy-releases.txt
# is pushed.
on:
  push:
    branches: ["claude/fervent-gates-cs7smv"]
    paths: [".github/tidy-releases.txt"]

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename and add
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in ollieos:v1.0 ollieos1.1:v1.1 ollieosv1.3:v1.3 ollieosv1.5:v1.5 ollieos.6:v1.6 ollieosv1.7:v1.7; do
            tag="${pair%%:*}" name="${pair##*:}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "Ollie OS $name" && echo "renamed $tag to Ollie OS $name"
            else
              echo "(no release $tag)"
            fi
          done
          if ! gh release view ollieosv1.4 >/dev/null 2>&1; then
            test -s downloads/Ollie-OS-1.4-Updater-x86_64.AppImage
            gh release create ollieosv1.4 --target "$(cat .github/tidy-releases.txt)" --title "Ollie OS v1.4" --latest=false \
              --notes "Ollie OS 1.4. This is its Updater, for an Ollie OS that is already installed. Ollie OS v1.7 has everything in 1.4 and much more: use the newest version." \
              downloads/Ollie-OS-1.4-Updater-x86_64.AppImage
            echo "created v1.4"
          fi
