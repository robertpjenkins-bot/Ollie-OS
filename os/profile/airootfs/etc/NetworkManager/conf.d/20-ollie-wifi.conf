# Wi-Fi that stays connected. Wi-Fi "power saving" makes many Wi-Fi chips
# (the Steam Deck's and many laptops') drop off after a while and say
# "searching for networks", so it is switched off. The computer's own MAC
# address is used for scanning, since a changing one makes some routers and
# chips lose the network.
[connection]
wifi.powersave = 2

[device]
wifi.scan-rand-mac-address = no
